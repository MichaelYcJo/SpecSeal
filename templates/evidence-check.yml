# Evidence-rot detection — fails the build when the evidence ledger's
# spec-to-code coordinates stop resolving; warns (exit 1) on ranges touched
# since the ledger's baseline commit.
#
# RIDER: "warns (exit 1)" above, and "let drift warn without blocking" below,
# both promise a softer mode this file does not deliver. Executed: drift exits
# 1 with or without `--strict`, and a plain `bash -e` step fails on it. The two
# skills that described the flag were corrected by the change this rider names;
# this template was outside it. Verified 2026-08-31 at 9829412.
#
# Setup: run /specseal:evidence-ci — it vendors the checker to
# tools/evidence_check.py and writes this workflow, resolving the plugin's
# own location so you never need to know where it is installed.
#
# Doing it by hand instead: copy the checker from the plugin's
# skills/evidence-check/scripts/ into tools/, then copy this file to
# .github/workflows/evidence-check.yml.

name: evidence-check

on:
  pull_request:
    paths:
      - "docs/**"
      - "src/**"
      - "tools/evidence_check.py"

jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # drift check diffs against the ledger's baseline SHA

      - name: Check evidence ledger coordinates
        run: |
          # --strict fails the build for three things, not one: drift, a row
          # with no baseline at all (UNMEASURED), and a row carrying two
          # disagreeing stamps (AMBIGUOUS). Without it all three print and
          # pass and only a broken coordinate fails.
          #
          # A repository that writes one ledger fragment per work item will
          # meet UNMEASURED routinely — a fragment row has no baseline until
          # its line is committed — so start without --strict and add it once
          # the ledger is settled.
          python3 tools/evidence_check.py --strict .
