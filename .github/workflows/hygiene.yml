name: hygiene

on:
  pull_request:
    # `ready_for_review` and `converted_to_draft` are NOT in the default set
    # (`opened`, `synchronize`, `reopened`), and leaving them out made the
    # draft excuse a permanent way past every check below. Open the pull
    # request as a draft while a review is still running, let the checks pass
    # on the draft's terms, then press Ready for review: no commit follows, so
    # no `synchronize` fires, nothing re-runs, and the draft's green stays on
    # that SHA through the merge. Two clicks, no commit.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]

# Stated rather than inherited, since #359. Before it this file declared no
# block and used no `gh`, so its token was whatever an enterprise,
# organisation or repository default happened to be — a setting nobody here
# has read. Every step in the job reads and none of them writes, so both
# scopes are `read`: narrower than any default, and now a fact of the file
# rather than of an account setting.
permissions:
  contents: read
  issues: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A closing keyword claims the ONE number that follows it. PR #162's
      # body wrote `Closes #153 and #150`; the 0.8.0 release closed #153 and
      # left #150 open, and somebody closed it by hand afterwards. Nothing
      # malfunctioned — GitHub reads it that way and so does
      # `close_issues_on_release.py`, whose own comment says so two lines
      # above its regex. The rule was written down in the one file whose
      # author needs it least while the prose is being written.
      #
      # So this reports the split — every number the body claims, every one it
      # merely mentions — and never fails. A check that goes red on prose
      # stops a release for a false positive, and one measured occurrence does
      # not buy that. Its only non-zero exit is a step handed no body at all.
      #
      # FIRST among the steps, because the gates below it can stop the job and
      # a reminder nobody reaches is not a reminder — and a body is most worth
      # rereading on a build that is already red.
      #
      # The body goes through `env:`. It is text whoever opens the pull
      # request wrote, and `${{ }}` inside `run:` is textual substitution into
      # a shell script.
      - name: every issue this pull request claims, and every one it only names
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: python3 .github/scripts/issue_claims_check.py

      # Updates are keyed to the version in plugin.json, not to commits — a
      # change to what ships that leaves the version alone reaches nobody.
      - name: a change to what ships must move the version
        shell: bash
        run: |
          # Work accumulates on a release branch; the version moves once,
          # when that branch merges to `main`. Asking every feature PR to bump
          # it is what made one commit one release.
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "base is ${{ github.base_ref }}, not a release PR — the version moves when next merges to main"; exit 0
          fi
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          # What the plugin loader reads or puts in front of a user: `bin/` is
          # on the Bash tool's PATH while the plugin is enabled, so a wrapper
          # fix ships like a skill does. It was missing here and nothing said
          # so; `tests/test_the_release_check_watches_what_ships.py` now
          # classifies every top-level entry against this list (#10).
          ships=$(echo "$changed" | grep -E '^(skills|agents|hooks|templates|bin|\.claude-plugin)/' || true)
          if [ -z "$ships" ]; then
            echo "nothing that ships changed"; exit 0
          fi
          old=$(git show "$base:.claude-plugin/plugin.json" | python3 -c 'import json,sys; print(json.load(sys.stdin)["version"])')
          new=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          echo "version: $old -> $new"
          echo "$ships"
          if [ "$old" = "$new" ]; then
            echo "::error::this PR changes what ships but leaves plugin.json at $old — an update keyed to the version will not reach anyone"
            exit 1
          fi

      # A change writes `seal/specs/<work-item-id>/changelog.md` instead of
      # appending to `CHANGELOG.md` — three parallel branches shared that one
      # file and nothing else, and the conflict arrived after the broad gate
      # had run, where nothing may be edited.
      #
      # Gathering them is a step somebody has to remember, and the release
      # pull request is the last moment anyone is looking. A fragment that
      # never reached the file is a change that ships with no entry: the user
      # `hooks/version-check.py` tells about a new release has nothing to read.
      #
      # It runs only for a release, because that is the only moment the
      # fragments are meant to be in the file. On a feature pull request every
      # fragment on the branch is legitimately ungathered.
      - name: every changelog fragment reached the released file
        shell: bash
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "base is ${{ github.base_ref }} — fragments are gathered when the release reaches main"; exit 0
          fi
          python3 .github/scripts/gather_changelog.py --check

      # The other fragment a change writes is `seal/ledger/<work-item-id>.md`,
      # its evidence rows. The release folds those into `seal/ledger.md`
      # and removes the fragment; a fragment left behind is a directory that
      # grows by one file per work item forever, which is issue #78. The same
      # step refuses while any `seal/specs/<id>/evidence-todo.md` has an open row —
      # a fact a reviewer verified that never reached the ledger — so the
      # check reads those too: a fold done by hand still meets the guard here.
      #
      # Release only, for the same reason as the changelog step: on a feature
      # pull request every fragment on the branch is legitimately unfolded.
      - name: every ledger fragment folded into the gathered ledger
        shell: bash
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "base is ${{ github.base_ref }} — fragments are folded when the release reaches main"; exit 0
          fi
          python3 .github/scripts/fold_ledger.py --check

      # An `unverified` row records a claim nobody proved and names who can
      # answer it. Nothing ever read those rows again — one of them said the
      # gates had never been seen rendering in a TUI, and months later the
      # user hit exactly that.
      #
      # So the tally is printed on every PR. It never fails for an open item —
      # a red build for an honest row teaches sessions to write none, which
      # voids the condition. It fails only for what the author can always fix:
      # a section that cannot be read, a table with fewer rows than where this
      # branch forked from the base, a file that was there and is gone, and a
      # base ref that either does not resolve or shares no history with HEAD
      # (exit 2, because nothing was compared).
      #
      # The ref goes in and `git merge-base <ref> HEAD` is what gets read.
      # `github.base_ref` names a branch that MOVES, and on a release branch it
      # moves by one squash per work item: the moment one item landed, every
      # sibling branch cut before it read the squashed item's `overview.md` as
      # rows that left the record. Three of 0.9.2's four branches paid a merge,
      # a re-run broad gate and a re-pushed pull request for that (#272).
      - name: the unverified record is readable, and rows leave it closed
        shell: bash
        run: |
          python3 skills/verify/scripts/unverified_check.py \
            --baseline "origin/${{ github.base_ref }}" seal/specs/

      # The review chain used to be enforced only at the commit, where the
      # gate could not tell "routed to the chain, not reviewed yet" from
      # "nobody decided anything" — so it asked at every commit of every
      # round. Recording the answer lets it stay quiet, and that is only
      # allowed because the check moved here rather than disappearing.
      #
      # It never fails for a pull request that declared NOTHING — the same
      # reasoning the step above gives for an honest open row: a build that
      # goes red for one teaches people to write none. It fails for what the
      # author can fix: a declaration that says "through the review chain"
      # with no committed round record, a declaration that cannot be read, a
      # round record whose `Pass` is checked while a 🔴 in its own verdict
      # table is still open, and — on a pull request that is not a draft — a
      # last round whose `Pass` was never checked at all.
      #
      # The draft state comes from GITHUB_EVENT_PATH, which this runner
      # already sets. A review still running opens its pull request as a
      # draft; that is the only way past the `Pass` requirement.
      # `chain_check.py` looks for a round's `Target SHA` on HEAD, on the
      # branch the declaration names, and on the pull request head that
      # carried it. Only the last one survives: a squash discards the reviewed
      # commits and a branch is a name anything can delete — five were, by
      # hand, and a release pull request went red naming six commits
      # that were all still sitting on a `refs/pull/<N>/head`.
      #
      # `actions/checkout` fetches branches and tags, never this namespace, so
      # it is fetched here rather than depended on. `--no-tags` because the
      # tags are already there and a tag in the candidate set is the failure
      # `chain_check.py` records for resolving a bare name.
      - name: the pull request heads a round record may name
        shell: bash
        run: |
          git fetch --no-tags --quiet origin \
            '+refs/pull/*/head:refs/remotes/pull/*/head'

      - name: a declared review chain has the round record it claimed
        shell: bash
        run: |
          python3 skills/code-review/scripts/chain_check.py \
            --baseline "origin/${{ github.base_ref }}"

      # A fix pass repairs the coordinate a finding named, and the fact behind
      # it is usually written down somewhere else too. The copies nobody
      # touched come back as a later round — `agent-contract` §12 is the rule
      # against it, it reaches every agent at startup, and it has been
      # re-broken seven times by parties that had read it. So this is the
      # check rather than an eighth sentence.
      #
      # It runs here as well as at the fix pass because a review round cannot
      # run it at all: contract §2 leaves the broad gate to whichever agent
      # definition assigns it and no reviewer's does, and #269 is one reworded
      # sentence whose pin stayed behind
      # in a test module that was red from that commit through two rounds and
      # past two gates.
      #
      # **This one fails, where the two steps above only print, and the
      # difference is measured.** Over four real merged pull requests it
      # reported once, and that report is `seal/ledger.md` row R3 carrying a
      # claim a docstring had corrected — a defect that shipped, and #267 is
      # the ticket it became. A branch that means to keep a survivor answers it
      # in `seal/specs/<id>/survivors.md` with a quote from the standing text
      # and the grounds; the quote is the anchor, so the exemption stops
      # holding once that text changes.
      #
      # **It runs on a pull request into a release branch and not on one into
      # `main`, because the range decides what this check means.** The range
      # it was calibrated over is a fix pass's — 77 real ones, and the floor of
      # 1.6 was chosen against that curve. A release pull request's range is
      # the union of every work item the release carries, which is a range no
      # fix pass ever writes: the wording one item removed is measured against
      # four other items' prose, and every one of those items was already
      # checked at its own pull request. Measured on the release that added
      # this step: over five work items it reported **72** places, none of them
      # a survivor of the range that removed the wording. So the union is not
      # a bigger version of the same question, it is a different one, and the
      # answer to it here is silence rather than a raised floor.
      - name: wording this branch removed is not still standing elsewhere
        shell: bash
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "base is main — a release's range is every work item it carries, which is not a range a fix pass wrote; each of them was checked at its own pull request"; exit 0
          fi
          # `if`, not `&&`: an unmatched glob leaves the pattern itself as the
          # loop's one value, and whether `set -e` forgives a failing test at
          # the tail of an `&&` list is a rule nobody should have to recall to
          # read this. Most branches match nothing here.
          exempt=()
          for file in seal/specs/*/survivors.md; do
            if [ -e "$file" ]; then exempt+=(--exempt "$file"); fi
          done
          python3 skills/code-review/scripts/survivor_check.py \
            --range "origin/${{ github.base_ref }}...HEAD" ${exempt[@]+"${exempt[@]}"}

      # `docs/flow.md` used to ask *is everything in* as a checklist bullet a
      # person ticked, and #351 deleted the file. Nothing replaced it, and
      # nothing had ever checked it: `docs/issues-and-milestones.md` says a
      # milestone answers *what is in 1.2.3*, and until this step a wrong one
      # cost a person a wrong answer and cost no automation anything.
      #
      # It refuses on `M \ D` — the milestone claims an open issue this
      # release branch does not carry — computed from the branch's own
      # commits rather than from the labels the signal wrote. Computing it
      # from the labels would give the same answer by transitivity and blame
      # the wrong party: a release blocked because a label write failed is
      # repaired by a person adding a label by hand, which is the act #359
      # exists to remove.
      #
      # Release only, like the three steps above it. The head must ALSO be a
      # `release/v*` branch, and that half is the script's rather than this
      # guard's: `docs/branch-and-release.md` lists a hotfix branch as the
      # other thing that reaches `main`, a hotfix carries no release
      # milestone, and what the script does about a shape it cannot judge is
      # a case (S7) where a shell condition would be untestable.
      #
      # This is the first step in this file to use `gh`, which is why the job
      # gained the `permissions:` block above.
      - name: the milestone this release claims is the work it carries
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_BRANCH: ${{ github.head_ref }}
          # The checkout above has no `ref:`, so on a `pull_request` event
          # this job holds the MERGE ref — the head already merged into the
          # base. `git merge-base origin/main HEAD` then answers the base tip
          # instead of the fork point, and the range the script documents
          # collapses to the one `questions.md` Q8 rejected. Naming the head
          # commit is what keeps the fork point real (#359, round 1).
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE: origin/${{ github.base_ref }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          if [ "${{ github.base_ref }}" != "main" ]; then
            echo "base is ${{ github.base_ref }} — the milestone is judged when the release reaches main"; exit 0
          fi
          python3 .github/scripts/release_completeness_check.py

      # `seal/config.md`'s `Mode` row says which of the two places the root
      # should live at; the folder's location says where it is. Nothing at
      # runtime reads the row — every gate resolves the root through
      # `hooks/optin.py#home_at` — so the row is the one thing here that can
      # quietly stop being true, and this is what stops it.
      #
      # It fails only for a disagreement, which is always the author's and
      # always one command from fixed (`seal mode --apply` moves the folder,
      # `seal mode <the folder's mode>` corrects the row). An absent row is
      # not a disagreement and passes: it is the state every repository with
      # a config.md is in today, since the pull-request language shipped as
      # its only row.
      #
      # Only one direction can ever reach CI, and that is the whole of what
      # is observable here: local mode commits nothing, so a repository in it
      # has no workflow and no committed row. What this catches is a row
      # saying `local` beside a root that is committed in the tree.
      - name: the mode the row declares is the mode the folder is in
        shell: bash
        run: |
          python3 skills/implement/scripts/seal.py mode --check

      # The block between `<!-- specseal:start -->` and `<!-- specseal:end -->`
      # is what `install.sh` ships into a user's CLAUDE.md, and it used to be
      # cut out of this repository's own CLAUDE.md — the file every session
      # here loads, which carries the house rules below the same markers.
      # #292 measured that copy against an installed block and found `## Git`
      # 95 % identical: one sentence had moved in one and not the other, and
      # nothing read both. So the block lives in `templates/claude-md-block.md`
      # and the repository's copy is generated from it, and this is what keeps
      # the copy a copy rather than a second source.
      #
      # It fails only for a disagreement, which is always the author's and
      # one command from fixed (`claude_block.py --write`). Every pull
      # request, not release only: the copy is read by every session in this
      # repository, so a drift that waits for the release is one every branch
      # in between builds on. A CLAUDE.md with no markers exits 2 and fails
      # too, because the step would then be measuring nothing.
      #
      # What it found at birth: nothing, because the copy was generated in
      # the commit that added it. The drift it was written against is between
      # the repository's copy and an installed one, which sits on a user's
      # machine where no step here can read it; what this reaches is the copy
      # the installer used to read, and holding that to the template is what
      # makes the next installed block the template's.
      - name: the CLAUDE.md block is the template's, line for line
        shell: bash
        run: |
          python3 .github/scripts/claude_block.py --check

      # A reminder, not a gate: the language policy keeps the Korean README a
      # human-facing mirror, and mirrors drift one edit at a time.
      - name: both READMEs move together
        shell: bash
        run: |
          base="origin/${{ github.base_ref }}"
          changed=$(git diff --name-only "$base"...HEAD)
          en=$(echo "$changed" | grep -cx 'README.md' || true)
          ko=$(echo "$changed" | grep -cx 'README.ko.md' || true)
          if [ "$en" != "$ko" ]; then
            echo "::warning::README.md and README.ko.md did not change together — check whether the other one needs the same edit"
          fi
