name: publish the release note

# `docs/release-checklist.md` walked from the preparation branch to the tag and
# stopped. Publishing a GitHub Release was in no document and in no workflow,
# and three consecutive releases shipped without one (#386) — the run that
# measured it was the one that would have made it four.
#
# The step beside it gets done every time, because something reads the tag:
# `hooks/version-check.py` asks `git ls-remote --tags`, and an untagged release
# is one no installed session is ever told about. The note had no reader in the
# tree at all, so nothing noticed its absence and the only cost was borne by a
# person opening the releases page.
#
# So the tag push publishes it. That is the release's last manual act and the
# one `docs/branch-and-release.md` keeps a person's — nothing in CI pushes a
# tag, and nothing here creates one either. By the time it exists, the
# release's own file this publishes, `changelog/X.Y.Z.md`, has been gathered,
# reviewed and merged to `main`.
#
# Then the seal (#718). A second job, `seal`, runs only when `publish` created
# the release in this run (`created` is its output; a re-pushed tag or a full
# re-run finds a release already there and writes `false`, and a re-run of
# `seal` alone keeps `true` and meets the glance-table guard instead). It
# runs the suite at the tag, draws the owner's seal from
# `.github/scripts/release-seal.svg` with `rsvg-convert` (#832), attaches it
# as `seal.png`, and replaces the note's glance table with the image and one
# line of the table's counts (`.github/scripts/release_seal.py`). Every step
# of it is
# `continue-on-error`, and every failure the script meets is a log line and a
# `::warning::` with an exit of 0: the note is already out, and a seal that
# cannot be drawn costs the image and never the counts. So nothing in that
# job can turn the workflow red or touch a note this run did not write.

on:
  push:
    tags: ['v*']

# The first write of this scope in the repository, and the minimum
# `gh release create` needs. The workflow writes three things under it: one
# release (`publish`), one asset on that release and one edit of its note
# (`seal`). `gh pr list` reads the pull requests' labels and head branches
# under the same block, which is a read.
permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Whether this run created the release, which is the only release the
    # `seal` job may edit (`publish_release_note.py#write_output`).
    outputs:
      created: ${{ steps.note.outputs.created }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The tagged commit's message is where the title comes from, and a
          # depth-1 checkout of a tag still carries that one commit. The whole
          # history is fetched anyway so `git log -1 <tag>` resolves the tag
          # itself rather than whatever the runner happened to check out.
          fetch-depth: 0

      - name: publish the GitHub Release for this tag
        id: note
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: python3 .github/scripts/publish_release_note.py

  seal:
    needs: publish
    if: needs.publish.outputs.created == 'true'
    runs-on: ubuntu-latest
    # A hung suite must end as a failed step, not as a job the runner ends at
    # its six-hour default: a step's `continue-on-error` does not reach the
    # job's own timeout, and the job's line below keeps the run green if it
    # is reached anyway.
    timeout-minutes: 60
    continue-on-error: true
    steps:
      # Not shallow, for `test.yml`'s reason: a case asks git whether a
      # recorded SHA is an ancestor of HEAD, and at depth 1 none is.
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          fetch-depth: 0
          # Nothing in this job pushes: the draw reaches GitHub through `gh`
          # and `GH_TOKEN`. So the token is not left in `.git/config`, where
          # every process of the suite at the tag could read it.
          persist-credentials: false
      - uses: actions/setup-python@v5
        continue-on-error: true
        with:
          python-version: '3.12'
      # The suite's packages and Pillow, at the versions
      # `.github/scripts/run_tests.py` pins; a case holds this line to them.
      # cmarkgfm is among them since #647: the table walker's case imports it.
      - name: install the suite's packages and Pillow
        continue-on-error: true
        run: pip install pytest pytest-xdist markdown-it-py==4.2.0 pillow==12.3.0 cmarkgfm==2025.10.22
      # `rsvg-convert`, which draws the seal from its SVG (#832). The runner
      # image carries no SVG renderer, so `librsvg2-bin` is installed here,
      # without the packages apt recommends, after the package lists are
      # refreshed: an image's lists can name a version the mirror has since
      # dropped. `|| true` rather than `&&`: `apt-get update` exits non-zero
      # when any one list fails, a third-party list `librsvg2-bin` does not
      # come from included, and the install is still worth trying then. A
      # bare `;` is not enough: a step with no `shell:` runs under `bash -e`,
      # which ends the step at the failed refresh as `&&` did. Before the
      # suite, so the suite at the tag runs the one case that draws with the
      # real binary; an install that fails costs the image, and the draw's
      # `::warning::` says so.
      - name: install rsvg-convert
        continue-on-error: true
        run: sudo apt-get update || true; sudo apt-get install -y --no-install-recommends librsvg2-bin
      # `test.yml`'s ubuntu leg, plus the JUnit file the counts are read from.
      # No token is in this step's environment, and the checkout left none in
      # `.git/config`.
      - name: run the suite at the tag
        id: suite
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          git config --global user.email ci@ci
          git config --global user.name ci
          pytest tests/ -q -n auto --junitxml="$RUNNER_TEMP/suite.xml"
      - name: draw the seal and put it in the note
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          SUITE_XML: ${{ runner.temp }}/suite.xml
          SUITE_OUTCOME: ${{ steps.suite.outcome }}
        shell: bash
        run: python3 .github/scripts/release_seal.py
